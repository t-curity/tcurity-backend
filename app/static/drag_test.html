<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>T:CURITY 드래그 테스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-user-select: none;
      user-select: none;
    }

    .tc-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .tc-phase {
      background: #fff;
      border-radius: 28px;
      padding: 20px 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 100%;
    }

    .tc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .tc-phase-bars {
      display: flex;
      gap: 6px;
      flex: 1;
      margin-right: 16px;
    }

    .tc-phase-bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #f3f4f6;
      overflow: hidden;
    }

    .tc-phase-bar.active .tc-phase-bar__fill {
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #818cf8);
    }

    .tc-phase-bar__fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
    }

    .tc-close {
      width: 36px;
      height: 36px;
      background: #f3f4f6;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 드래그 영역 */
    .tc-drag-area {
      position: relative;
      padding: 50px 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 빈 박스 (이미지 대신) */
    .tc-canvas-box {
      position: relative;
      width: 100%;
      aspect-ratio: 835 / 408;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }

    .tc-canvas-box canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .tc-guide-band {
      display: none;
    }

    .tc-guide-center {
      position: absolute;
      box-sizing: border-box;
      border-left: 3px dashed #fff;
      pointer-events: none;
    }

    .tc-guide-text {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      font-size: 15px;
      font-weight: 500;
      color: #6b7280;
    }

    .tc-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 2000;
    }

    .tc-toast.show { opacity: 1; }

    .test-count {
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
      text-align: center;
    }

    .data-notice {
      margin-top: 20px;
      padding: 12px 16px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      font-size: 13px;
      color: #0369a1;
      text-align: center;
      line-height: 1.5;
    }

    .data-notice span {
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="tc-overlay">
    <div class="tc-phase">
      <header class="tc-header">
        <div class="tc-phase-bars">
          <div class="tc-phase-bar active"><div class="tc-phase-bar__fill"></div></div>
          <div class="tc-phase-bar"><div class="tc-phase-bar__fill"></div></div>
        </div>
        <button class="tc-close">×</button>
      </header>

      <div class="tc-drag-area" id="drag-area">
        <div class="tc-canvas-box" id="box">
          <canvas id="canvas"></canvas>
          <div class="tc-guide-band" id="guide-band"></div>
          <div class="tc-guide-center" id="guide-center"></div>
        </div>
      </div>

      <div class="tc-guide-text">절취선을 따라 드래그하세요</div>
      <div class="test-count" id="test-count">테스트 횟수: 0회</div>
      <div class="data-notice">
        📊 드래그 패턴 데이터 수집 중<br>
        <span>수집된 데이터는 서비스 개선에만 사용됩니다</span>
      </div>
    </div>
  </div>

  <div class="tc-toast" id="toast"></div>

  <script>
    const API_BASE = window.location.origin;

    let guideLine = null;
    let points = [];
    let isDrawing = false;
    let canvas, ctx, box, dragArea;
    let testCount = 0;

    function init() {
      dragArea = document.getElementById('drag-area');
      box = document.getElementById('box');
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');

      setupCanvas();
      generateGuideLine();
      renderGuideLine();

      dragArea.addEventListener('pointerdown', onPointerDown);
      dragArea.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);

      dragArea.addEventListener('dragstart', e => e.preventDefault());
      dragArea.addEventListener('selectstart', e => e.preventDefault());
    }

    function setupCanvas() {
      const rect = box.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    function getDeviceType() {
      return /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'mobile' : 'pc';
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 800);
    }

    function generateGuideLine() {
      const centerX = 0.25 + Math.random() * 0.5;
      const yStart = 0.02;
      const yEnd = 0.98;
      const width = getDeviceType() === 'mobile' ? 0.12 : 0.18;

      guideLine = {
        start: [centerX, yStart],
        end: [centerX, yEnd],
        width: width
      };
    }

    function renderGuideLine() {
      const rect = box.getBoundingClientRect();
      const [sx, sy] = guideLine.start;
      const [ex, ey] = guideLine.end;

      const startX = sx * rect.width;
      const startY = sy * rect.height;
      const endY = ey * rect.height;
      const bandWidth = guideLine.width * rect.width;
      const height = endY - startY;

      const band = document.getElementById('guide-band');
      band.style.left = `${startX - bandWidth / 2}px`;
      band.style.top = `${startY}px`;
      band.style.width = `${bandWidth}px`;
      band.style.height = `${height}px`;

      const center = document.getElementById('guide-center');
      center.style.left = `${startX}px`;
      center.style.top = `${startY}px`;
      center.style.height = `${height}px`;
    }

    function onPointerDown(e) {
      e.preventDefault();
      isDrawing = true;
      points = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      points.push(getPoint(e));
      dragArea.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      if (!isDrawing) return;
      e.preventDefault();

      const point = getPoint(e);
      points.push(point);

      if (points.length >= 2) {
        const prev = points[points.length - 2];
        const curr = points[points.length - 1];
        
        if (isInBoxBounds(prev) && isInBoxBounds(curr)) {
          ctx.beginPath();
          ctx.moveTo(prev.canvas_x, prev.canvas_y);
          ctx.lineTo(curr.canvas_x, curr.canvas_y);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }
    }

    function onPointerUp(e) {
      if (!isDrawing) return;
      isDrawing = false;
      
      points.push(getPoint(e));

      if (points.length < 3) {
        showToast('다시 시도해주세요');
        setTimeout(reset, 500);
        return;
      }

      // progress 계산
      const progress = calculateProgress();
      
      if (progress < 0.8) {
        showToast('끝까지 그어주세요');
        setTimeout(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          points = [];
        }, 500);
        return;
      }

      saveData(progress);
      testCount++;
      document.getElementById('test-count').textContent = `테스트 횟수: ${testCount}회`;

      showToast('✓ 저장됨');
      setTimeout(reset, 800);
    }

    function calculateProgress() {
      if (points.length < 2) return 0;

      const [_, sy] = guideLine.start;
      const [__, ey] = guideLine.end;
      const guideLength = ey - sy;

      const ys = points.map(p => p.img_y);
      const minY = Math.max(sy, Math.min(...ys));
      const maxY = Math.min(ey, Math.max(...ys));

      return Math.max(0, (maxY - minY) / guideLength);
    }

    function getPoint(e) {
      const boxRect = box.getBoundingClientRect();
      
      const canvas_x = e.clientX - boxRect.left;
      const canvas_y = e.clientY - boxRect.top;
      const norm_x = canvas_x / boxRect.width;
      const norm_y = canvas_y / boxRect.height;

      return {
        viewport_x: e.clientX,
        viewport_y: e.clientY,
        canvas_x,
        canvas_y,
        img_x: Math.round(norm_x * 10000) / 10000,
        img_y: Math.round(norm_y * 10000) / 10000,
        timestamp: Date.now()
      };
    }

    function isInBoxBounds(point) {
      return point.img_x >= 0 && point.img_x <= 1 && 
             point.img_y >= 0 && point.img_y <= 1;
    }

    function reset() {
      points = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      generateGuideLine();
      renderGuideLine();
    }

    function saveData(progress) {
      const data = {
        session_id: `test-${Date.now()}`,
        test_number: testCount,
        logged_at: new Date().toISOString(),
        device_type: getDeviceType(),
        user_agent: navigator.userAgent,
        screen_width: window.innerWidth,
        screen_height: window.innerHeight,
        
        guide_line: guideLine,
        
        start_point: points.length > 0 ? {
          x: points[0].img_x,
          y: points[0].img_y
        } : null,
        end_point: points.length > 0 ? {
          x: points[points.length - 1].img_x,
          y: points[points.length - 1].img_y
        } : null,
        
        progress: Math.round(progress * 10000) / 10000,
        duration_ms: points.length >= 2 ? 
          points[points.length - 1].timestamp - points[0].timestamp : 0,
        point_count: points.length,
        
        points: points
      };

      const saved = JSON.parse(localStorage.getItem('drag_test_data') || '[]');
      saved.push(data);
      localStorage.setItem('drag_test_data', JSON.stringify(saved));

      if (API_BASE && !API_BASE.includes('file://')) {
        fetch(`${API_BASE}/api/drag-test/log`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }).catch(err => console.error('API Error:', err));
      }

      console.log('Test Data:', data);
      console.log(`📊 총 ${saved.length}건 저장됨`);
    }

    window.showData = function() {
      const data = JSON.parse(localStorage.getItem('drag_test_data') || '[]');
      console.table(data.map(d => ({
        device: d.device_type,
        start_y: d.start_point?.y?.toFixed(3),
        end_y: d.end_point?.y?.toFixed(3),
        duration: d.duration_ms + 'ms',
        points: d.point_count
      })));
      return data;
    };

    window.exportData = function() {
      const data = JSON.parse(localStorage.getItem('drag_test_data') || '[]');
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `drag_test_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };

    window.clearData = function() {
      localStorage.removeItem('drag_test_data');
      console.log('🗑️ 삭제 완료');
    };

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
